<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Universe (NASA Eyes UX)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Top Left UI: Compact Hover Dropdown for Layers -->
    <div id="top-left-panel" class="glass-panel layer-dropdown">
        <div class="dropdown-header">
            <span class="icon">👁️</span> 레이어 제어
        </div>
        <div class="dropdown-content">
            <label class="toggle-control"><input type="checkbox" id="toggle-orbits" checked> <span>궤적 (Orbits)</span></label>
            <label class="toggle-control"><input type="checkbox" id="toggle-moons" checked> <span>작은 위성 (Moons)</span></label>
            <label class="toggle-control"><input type="checkbox" id="toggle-planets" checked> <span>주요 행성 (Planets)</span></label>
            <label class="toggle-control"><input type="checkbox" id="toggle-spacecraft" checked> <span>인류 탐사선 (Spacecrafts)</span></label>
            <label class="toggle-control"><input type="checkbox" id="toggle-iss" checked> <span>우주정거장 (ISS)</span></label>
            <hr class="panel-divider">
            <label class="toggle-control scale-toggle"><input type="checkbox" id="toggle-real-scale"> <span class="warning-txt">현실 비율 (Real Scale)</span></label>
        </div>
    </div>

    <!-- Timeline & Events HUD on Top Right with Filters -->
    <div id="timeline-panel" class="glass-panel collapsible">
        <div class="timeline-header">
            우주 연대기 (Timeline)
            <button class="toggle-collapse-btn" id="toggle-timeline">▼</button>
        </div>
        <div class="timeline-filters">
            <label><input type="checkbox" id="filter-natural" checked> 천문 현상</label>
            <label><input type="checkbox" id="filter-human" checked> 인류 우주항공</label>
        </div>
        <div id="events-container">
            <div id="events-list">
                <!-- Events injected dynamically by JS -->
            </div>
            <div id="current-time-marker">
                <span class="marker-text">현재 시간</span> <span class="marker-arrow">➜</span>
            </div>
        </div>
    </div>

    <!-- 3D Projected Tooltip -->
    <div id="hover-tooltip" class="glass-panel hidden">
        <h3 id="tt-name-en">Planet</h3>
        <h4 id="tt-name-ko">행성</h4>
        <div class="tt-metric"><span>표면 온도:</span> <span id="tt-temp">-</span></div>
        <div class="tt-metric"><span>공전 주기:</span> <span id="tt-period">-</span></div>
        <div class="tt-metric"><span>자전 주기:</span> <span id="tt-rotation">-</span></div>
    </div>

    <!-- UNIFIED Bottom Control Bar (NASA Eyes Style, Responsive for all) -->
    <div id="unified-bottom-bar" class="glass-panel">
        <div class="bottom-bar-content">
            <div id="date-display"><span id="current-date"></span></div>
            <input type="date" id="date-picker">
            <div class="divider-vertical"></div>
            <div class="controls-playback">
                <button id="btn-rewind" title="Decrease Speed">«</button>
                <button id="btn-pause">⏸</button>
                <button id="btn-fastforward" title="Increase Speed">»</button>
            </div>
            <div class="divider-vertical"></div>
            <div class="speed-indicator"><span class="speed-label">x1</span></div>
        </div>
    </div>

    <!-- JS Dependencies: Three.js, OrbitControls, Tween.js, Satellite.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
    
    <!-- Main Application Logic -->
    <script src="script.js"></script>
</body>
</html>
